<!doctype html>
<html lang="ja">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>検証レポート 台本（発表者用）</title>
<style>
  :root {
    --bg: #f4f3ef; --panel: #ffffff; --ink: #1d232b; --muted: #6a7280; --line: #e2e0d9;
    --accent: #0b63b0; --accent-soft: #e4eef8; --star: #b4530b; --star-soft: #fdf0e3;
    --warn: #8a5a00; --warn-soft: #fbf3dc; --ok: #1f7a4d; --late: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181d; --panel: #1e232a; --ink: #e8eaed; --muted: #9aa3ae; --line: #2e353e;
      --accent: #6fb0ec; --accent-soft: #1c2c3d; --star: #f3a35c; --star-soft: #33261a;
      --warn: #e7c063; --warn-soft: #2f2a19; --ok: #5fcf95; --late: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.7 "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; display: grid; grid-template-rows: auto 1fr; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* 上の帯：接続・タイマー・ページ */
  .top { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .status.on i { background: var(--ok); }
  .timer { margin-left: auto; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
  .clock { font-size: 26px; font-weight: 700; letter-spacing: .02em; }
  .pace { font-size: 13px; color: var(--muted); }
  .pace.ok { color: var(--ok); } .pace.late { color: var(--late); font-weight: 700; }
  .pg { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .wrap { display: grid; grid-template-columns: 240px 1fr 340px; min-height: 0; }
  /* 左：画面の一覧 */
  .toc { overflow: auto; padding: 10px 8px; border-right: 1px solid var(--line); }
  .toc button { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 6px; font-size: 13.5px; line-height: 1.45; }
  .toc button:hover { background: var(--accent-soft); }
  .toc button.on { background: var(--accent); color: #fff; font-weight: 700; }
  .toc .no { font-variant-numeric: tabular-nums; opacity: .8; }
  .toc .mn { font-size: 12px; opacity: .7; }

  /* 中央：いまの画面の台本 */
  .main { overflow: auto; padding: 22px 32px 60px; }
  .detail-on { display: none; margin-bottom: 14px; padding: 8px 14px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .detail-on.show { display: block; }
  .head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 14px; }
  .head .n { font-size: 44px; font-weight: 800; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
  .head h1 { margin: 0; font-size: 28px; line-height: 1.35; }
  .head .mn { margin-left: auto; white-space: nowrap; color: var(--muted); font-size: 14px; }
  .head .pos { white-space: nowrap; color: var(--muted); font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
  .head .n:empty { display: none; }
  .intro { margin: 0 0 18px; padding: 14px 18px; border: 2px solid var(--accent); border-radius: 10px; }
  .intro h2 { margin: 0 0 6px; font-size: 15px; color: var(--accent); }
  ul.b { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  ul.b li { position: relative; padding: 8px 12px 8px 34px; border-radius: 8px; font-size: 20px; line-height: 1.6; }
  ul.b li::before { position: absolute; left: 10px; top: 8px; font-size: 16px; }
  ul.b li.say::before { content: "●"; color: var(--muted); font-size: 11px; top: 16px; left: 13px; }
  ul.b li.star { background: var(--star-soft); font-weight: 700; }
  ul.b li.star::before { content: "★"; color: var(--star); }
  ul.b li.warn { background: var(--warn-soft); color: var(--warn); font-size: 16px; }
  ul.b li.warn::before { content: "⚠"; }
  ul.b li.q { background: var(--accent-soft); font-size: 16px; padding-left: 12px; }
  ul.b li.opt { opacity: .75; border: 1px dashed var(--line); }
  .qchip { display: inline-grid; place-items: center; width: 22px; height: 22px; margin-right: 6px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; vertical-align: 2px; }
  .opt { display: inline-block; margin: 0 4px; padding: 0 8px; border-radius: 999px; background: var(--line); color: var(--muted); font-size: 12px; font-weight: 700; vertical-align: 2px; }
  .next { margin-top: 26px; padding: 12px 16px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 15px; }
  .next b { color: var(--ink); }
  code { font-size: .9em; background: var(--line); padding: 0 4px; border-radius: 4px; }

  /* 右：いつでも見る資料 */
  .side { overflow: auto; border-left: 1px solid var(--line); padding: 12px 14px 40px; font-size: 14px; }
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; position: sticky; top: -12px; background: var(--bg); padding: 8px 0; }
  .tabs button { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12.5px; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .side ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
  .side ul.b li { font-size: 14px; padding: 6px 8px 6px 28px; }
  .side table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .side td { border-bottom: 1px solid var(--line); padding: 6px 4px; vertical-align: top; }
  .side tr:first-child td { font-weight: 700; color: var(--muted); }
  .meta p { margin: 0 0 8px; }
  .keys { margin-top: 14px; color: var(--muted); font-size: 12.5px; }

  @media (max-width: 1100px) { .wrap { grid-template-columns: 190px 1fr; } .side { display: none; } }
</style>
</head>
<body>
<header class="top">
  <button class="btn primary" id="open">検証レポートを開く</button>
  <span class="status" id="status"><i></i><span>検証レポートと未接続</span></span>
  <div class="timer">
    <span class="pace" id="pace">予定 0:00</span>
    <span class="clock" id="clock">0:00</span>
    <button class="btn" id="tgo">開始</button>
    <button class="btn" id="treset">リセット</button>
  </div>
  <span class="pg" id="pg">1 / 25</span>
</header>
<div class="wrap">
  <nav class="toc" id="toc" aria-label="画面の一覧"></nav>
  <main class="main">
    <div class="detail-on" id="detailOn"></div>
    <div class="head"><span class="n" id="hn"></span><h1 id="ht"></h1><span class="pos" id="hp"></span><span class="mn" id="hm"></span></div>
    <div id="intro"></div>
    <ul class="b" id="bul"></ul>
    <div class="next" id="next"></div>
  </main>
  <aside class="side">
    <div class="tabs" id="tabs"></div>
    <div id="panel"></div>
  </aside>
</div>
<script>
var D = {"meta": ["対象: <b>検証レポート（全25画面・キット v2.0 反映）</b> https://hse-inc.github.io/lp-scheme-proposal/scheme-report/", "軸: <b>新しいスキームで初稿は速く、機械で測れる品質は安定した。ただ、当時の検査が見ていない種類のミスで貴社に修正をお願いしてしまった。だから「ご指摘を二度と起こさない仕組み」に組み替えた（キット v2.0）</b>", "所要: 本編 約30分＋質疑（［ ］は目安の分数）", "操作: 矢印キー・スペースで進む。（？）で補足が開く（Escで閉じる）", "凡例: ●＝言うこと ／ ★＝強調したい一言 ／ ⚠＝注意（社内メモ。読まない） ／ （時間あれば）＝押していたら飛ばす"], "intro": [{"k": "say", "h": "先日ご提案したスキームを、実案件5本で試した結果のご報告です", "opt": false}, {"k": "say", "h": "まずお詫びから：アステップ様で、文字の重なりや見やすさといった、本来こちらで止めるべき初歩的なミスを貴社に見つけていただきました。申し訳ありませんでした", "opt": false}, {"k": "star", "h": "今日は「速くなった」だけでなく、「ご指摘をいただかない形にどう組み替えているか」を中心にお話しします", "opt": false}, {"k": "warn", "h": "お詫びは短く、言い訳しない。原因と対策は8〜11画面・14画面で話す", "opt": false}], "summary": [{"k": "say", "h": "<b>速さ</b>：初稿まで旧キット約2時間 → 33〜72分", "opt": false}, {"k": "say", "h": "<b>品質</b>：測れるもの（文言・CSSの散らかり・1画面の収まり・余白・ページ送り）は5本とも合格", "opt": false}, {"k": "say", "h": "<b>課題</b>：当時の検査が見ていない種類（重なり・配色・はみ出し）で貴社に修正をいただいた／社内の確認は1〜4回と案件で差がある", "opt": false}, {"k": "say", "h": "<b>対策</b>：いただいたご指摘29件を再発防止チェックリストに（道具・土台8／手順16／未対応5）。寺嶋さんの確認項目8つを最終の門にして、通らなければ公開できない形に組み替えた（v2.0・10/20）。新しい検査で5本を洗い直し、直すべきものを順に直している", "opt": false}, {"k": "say", "h": "<b>ご相談</b>：評価・ほかの制作者での試用・環境・実機確認の分担・キットの渡し方と契約", "opt": false}], "ask": [], "qa": [["質問", "答え方"], ["同じミスがまた起きない保証は？", "測れるものは検査で止め、通らなければ公開できない形にしました（v2.0）。測れないものは一覧画像で責任者が承認しないと公開できません。それでも出たご指摘は、チェックリストに足し、道具に移せないかを考えて次から止めます"], ["洗い直しで ✕ がこんなに出たのは、初稿の質が低かったということ？", "基準を上げたためです。中身は3種類で、わざと端から覗かせる絵の宣言漏れや、淡い文字の配色も含みます。直すべきものも含まれていたので、順に直しています"], ["検査が増えて遅くならない？", "公開1回あたり約340秒から約490秒に増えました。検査を同時に流すなどで短くしていきます（15画面）"], ["時間が延びている案件があるのは？", "読み落としを減らすための分析を初稿の前に足したためです（推測を含む）。修正の往復を減らすほうを優先しています"], ["ほかの制作者でも同じようにできる？", "まだ検証していません。だからご相談2（試用）をお願いしたいです"], ["AIで作っていて大丈夫？", "書くのは中身と案件固有の見た目だけで、土台・検査・公開は固定の道具です。AIで直せる範囲と人が見る範囲を分けて運用します"]], "screens": [{"n": 1, "t": "結論", "min": 1.5, "b": [{"k": "star", "h": "<b>まず結論：そもそもの課題だった「CSS の散らかり」と「スクロールの不具合」は、根本から解決できたと言ってよい</b>。散らかりは毎回同じ土台から作って5本とも0件、スクロールは CSS のスナップに一本化して毎回検査（5本とも合格）。iPhone 実機の触り心地だけは公開前に人が触って確かめる", "opt": false}, {"k": "say", "h": "10月16日〜20日に、メタメディア様・FUKURU様・鈴興建設様・アステップ様・groxi様の5本を新しいスキームで作りました", "opt": false}, {"k": "say", "h": "速さ：AI の初稿（社内確認の前）までの作業時間は33〜72分。弊社の確認と直し、先方への提出までは含まない（聞かれたらそう答える）。旧キット（たくみ様）の約2時間から大きく減りました", "opt": false}, {"k": "say", "h": "品質：機械で測れるものは5本とも初稿から合格。CSSは400行前後で、前回調べた実例サイト（583〜7,568行）より少なく、散らかりも0件", "opt": false}, {"k": "say", "h": "課題：社内の確認は、まとめて数えると1〜4回で、案件で差がある。主因は参考サイトと仕様書の読み落とし", "opt": false}, {"k": "star", "h": "そして一番大事なのが下の帯：<b>いただいたご指摘をすべて再発防止のチェックリストにし、ディレクターチェック項目（8項目）を最終の門にしました</b>（8〜11画面で詳しく）", "opt": false}], "badge": ""}, {"n": 2, "t": "検証した5本", "min": 1.0, "b": [{"k": "say", "h": "5本とも、シートと参考サイトからキットの手順どおりに作りました", "opt": false}, {"k": "say", "h": "案件ごとに学びをキットに戻しているので、版が案件ごとに違います（v1.1 → v1.14）", "opt": false}, {"k": "say", "h": "比べる相手は、弊社の旧キットのたくみ様。現行マニュアルの制作時間は実測が無いので、時間は比べていません", "opt": false}, {"k": "say", "h": "<span class=\"opt\">時間あれば</span>FUKURU様はシートの指定で「通常スクロール＋画像の1枚目」に切り替えて対応", "opt": true}], "badge": ""}, {"n": 3, "t": "スキームとしての完成度", "min": 2.0, "b": [{"k": "say", "h": "左の棒グラフ：たくみ様 約2時間〜2時間25分 → 33〜72分", "opt": false}, {"k": "say", "h": "アステップ様・groxi様が70分台なのは、仕様書の照合表と参考サイトの全セクション分析を初稿の前に必ずやる版で作ったため（推測を含む）。読み落としを減らすために時間を足しています", "opt": false}, {"k": "say", "h": "右の表：社内の確認（まとまりの回数）は、旧キット3回 → 1〜4回。FUKURU様・アステップ様は1回", "opt": false}, {"k": "say", "h": "貴社からの修正：FUKURU様・鈴興建設様は貴社からの修正なし。メタメディア様は修正2回、アステップ様は修正2回（v3）、groxi様は修正2回（v3・追加1点を対応中）", "opt": false}, {"k": "warn", "h": "社内の確認の回数は、細かく分けて送った指示を1回にまとめて数えた概数（数時間あいたら別の回）", "opt": false}, {"k": "warn", "h": "「速くなった」を強調しすぎない。次の4画面（時間をかけて質を上げている話）につなぐ", "opt": false}], "badge": ""}, {"n": 4, "t": "時間をかける分、貴社への提出版の質を高くしています", "min": 1.5, "b": [{"k": "say", "h": "上の1行の流れ：<b>AI の初稿（社内のみ）→ 弊社の責任者の確認と修正 → 貴社へご提出（v1）</b>。この画面の「修正」は、ご提出後に貴社からいただいたもの", "opt": false}, {"k": "say", "h": "AI の初稿まで33〜72分かかっていますが、そのぶん準備に時間を使っています", "opt": false}, {"k": "say", "h": "AI の初稿の前に、参考サイトの全セクションの「型の表」と、どのページにどの型を使うかの「割り当て表」を作っています。いいとこ取りを初稿の段階でやっている", "opt": false}, {"k": "say", "h": "仕様書（ヒアリングシート）も全セルを照合表にしてから作ります", "opt": false}, {"k": "say", "h": "スクロール・スワイプなど裏側のコードの不具合も、検査で0件にしてから出しています（5本とも。FUKURU様はスクロール型なのでページ送りは対象外）", "opt": false}, {"k": "star", "h": "結果：FUKURU様・鈴興建設様は<b>ご提出版のまま貴社からの修正なし</b>。アステップ様は修正2回、メタメディア様は修正2回、groxi様は修正2回（追加1点を対応中）", "opt": false}, {"k": "say", "h": "右の表は、貴社ディレクターからいただいたご評価の抜粋です（「流石のクオリティで修正点はない」「細かい要望まで汲み取っていただき完璧に」など）", "opt": false}, {"k": "warn", "h": "評価の言葉は読み上げすぎない。1〜2個にとどめる。寺嶋さんの名前は出さず「貴社ディレクター」", "opt": false}, {"k": "warn", "h": "下の帯のとおり、アステップ様の提出後の4点は当時の検査の盲点で起きた。ここで「質が高い」を言い切りすぎない（8〜11画面につなぐ）", "opt": false}], "badge": ""}, {"n": 5, "t": "AI の初稿と、弊社の確認後の比較①（貴社から修正をいただいた案件）", "min": 1.0, "b": [{"k": "say", "h": "左から AI の初稿（社内のみ）→ 弊社の責任者の修正後（ご提出版 v1）→ 貴社の修正後。AI が出したものと、責任者が手を入れたものの差を見ていただく画面", "opt": false}, {"k": "say", "h": "たくみ様（旧キット・2ページ目）：弊社で参考サイトの要素（文字の質感・写真の出方・白線の枠）の取り込み、強調の表現、写真と見出しの配置。貴社の修正は札と「#01」の間", "opt": false}, {"k": "say", "h": "メタメディア様（特徴①）：AI は3案を作り、最初に見せたのは案A。弊社でページごとに3案を組み合わせ、背景の明暗、放射の線・写真の帯、本文の太さ。貴社の修正は吹き出しを塗りに・背景を黒にそろえる", "opt": false}, {"k": "say", "h": "アステップ様（会社概要）：弊社で賑やかさと動き（キャラクターのイラスト・常時の動き）、見出しの組み方、余白と改行。貴社の修正は値の左端をそろえる", "opt": false}, {"k": "warn", "h": "AI のミスの細部や強い言葉は言わない。「どの種類を直したか」だけ言う", "opt": false}], "badge": ""}, {"n": 6, "t": "AI の初稿と、弊社の確認後の比較②（貴社からの修正がなかった案件・対応中の案件）", "min": 1.0, "b": [{"k": "say", "h": "FUKURU様（3つ目のセクション）：弊社で1枚目と見出しの作り直し、参考サイトの動き（流れる英字・写真の帯）、イラストの追加", "opt": false}, {"k": "say", "h": "鈴興建設様（3ページ目）：弊社で仕様書の配色の読み直し（濃いネイビーの面）、参考サイトに近い写真とイラストの置き方、強調の表現と動き", "opt": false}, {"k": "say", "h": "groxi様（2ページ目）：弊社で奥行きの背景と動き、見出しの書体と表現、配置、余白と行間。貴社の修正（PC のカード送り・強調の文の改行）は対応中", "opt": false}, {"k": "star", "h": "言いたいこと：AI の初稿は型と中身がそろった状態で出てくる。弊社の責任者は「参考サイトらしさ・賑やかさ・強弱」を足す役。だから貴社からの修正は細部で済んでいる", "opt": false}, {"k": "say", "h": "（？）「もう1ページずつ並べて見る・撮影の出どころ」は聞かれたら開く", "opt": false}, {"k": "warn", "h": "出どころ：AI の初稿は社内確認用URLへの最初の公開の記録から（メタメディア様は社内の比較動画で最初に見せた案A、アステップ様は版のURL v1 へ最初に出した版）。アステップ様の v1 は貴社のご指摘で上書きしたため、弊社の修正後は上書き直前の版を公開の記録から撮った。groxi様の v2 は未送信のため載せていない", "opt": false}], "badge": ""}, {"n": 7, "t": "アウトプットとしての完成度", "min": 2.0, "b": [{"k": "say", "h": "上の表：5本とも全検査合格。文言は一言一句一致、散らかり0、収まりの不合格0", "opt": false}, {"k": "star", "h": "ただし下の注記のとおり、この表は v2.0 より前の検査。アステップ様では<b>検査がすべて合格のまま</b>、重なり・配色・はみ出しのご指摘をいただきました。v2.0 でこの3種類を検査に加え、5本を洗い直しました（11画面）", "opt": false}, {"k": "say", "h": "実例サイトとの比較：CSSの量・直しても画面が変わらない行・!important・色の直書きのどれも0件", "opt": false}, {"k": "q", "h": "<span class=\"qchip\">？</span>「各検査で何を見ている？」は聞かれたら開く", "opt": false}], "badge": ""}, {"n": 8, "t": "修正のご依頼が出ない形を目指して", "min": 2.0, "b": [{"k": "star", "h": "これまで貴社からいただいたご指摘を<b>すべて</b>、二度と起こさないためのチェックリストにしました。29件です", "opt": false}, {"k": "say", "h": "内訳：道具・土台で止めているもの8件、手順で確かめているもの16件、未対応5件（v2.0 で4件を検査に移した）", "opt": false}, {"k": "say", "h": "運用：ご指摘をいただいたら、まずチェックリストに1行足す。防ぎ方は「ルール → 検査の道具 → 土台」の順に強くする。人の目で漏れたものは、まず道具に移せないかを考える。提出の前に全項目を確かめる", "opt": false}, {"k": "say", "h": "右下の「正直にお伝えしたいこと」：①②の番号ときっかけの補足文は、同じご指摘を2回いただいてから決まりにしました。アステップ様の4件は当時の検査が合格のまま起きました。v2.0 で4件とも検査に移し、修正前の版で4件とも検出できることを確かめています", "opt": false}, {"k": "warn", "h": "10原則（8項目を含む）の話は次の10画面で。ここでは「29件を全部チェックリストに」で止める", "opt": false}], "badge": ""}, {"n": 9, "t": "チェックリストの全項目", "min": 1.0, "b": [{"k": "say", "h": "29件を分類ごとに。状態の色：道具・土台／手順／未対応。右の A・B・C は段（10画面で説明）", "opt": false}, {"k": "say", "h": "道具で止めるようにした4件（#4 重なり・#9 語の重複・#10 配色・#19 ロゴのはみ出し）と、#25 PC で中央に詰まる（縦の詰まりの検査）は、v2.0 で検査に入りました。#9 は止めずに警告で出します", "opt": false}, {"k": "say", "h": "未対応の5件（短い一文の改行・強調の文の改行・吹き出しの印象・並びのページの背景・PC でカードを送れない）は、決まりにしていきます。それまでは一覧画像で目で確かめる", "opt": false}, {"k": "q", "h": "<span class=\"qchip\">？</span>「各項目の防ぎ方」は聞かれたら開く", "opt": false}], "badge": ""}, {"n": 10, "t": "提出前に AI が回すチェック（全案件に共通の10原則）", "min": 2.5, "b": [{"k": "star", "h": "<b>ご指摘を案件ごとに足すと、確かめる項目が積み重なって修正のたびに時間がかかる。だから、ご指摘29件とディレクターチェック項目8項目を、全案件に共通するデザインと実装の10原則に統合した</b>", "opt": false}, {"k": "say", "h": "デザインの7つ：参考のテイスト／余白は詰めすぎず均等に・縦の線をそろえる／文字を被せない・はみ出させない／文字は13px以上・意味で折る／同じ役割はそろえ最後まで続ける／画像を破綻させない／動きは速く", "opt": false}, {"k": "say", "h": "実装の3つ：型と操作が PC・スマホで動く／文言とシートを守る／公開の形（版ごとの URL・OGP・仮動画）", "opt": false}, {"k": "say", "h": "右端の列が、統合した旧8項目の番号。8項目はすべてこの中に入っている", "opt": false}, {"k": "say", "h": "道具で測れるもの（A）は検査で止め、測れないもの（B・C）は一覧画像を弊社の責任者が見て承認。<b>AI は承認欄を書けない決まり</b>", "opt": false}, {"k": "star", "h": "新しいご指摘が来たら、項目を足す前に「10原則のどれか」を決めて、その例として足す。項目を増やさない", "opt": false}, {"k": "star", "h": "寺嶋さんの目視を前提にせず、弊社の段階でゼロにしてから出します", "opt": false}, {"k": "q", "h": "<span class=\"qchip\">？</span>「承認欄の中身と、運用の決まり」は聞かれたら開く", "opt": false}, {"k": "warn", "h": "10原則への統合は資料の上の整理で、キットのチェックリストの組み替えはこれから（実案件でまだ回していない）。「完成した」とは言わない", "opt": false}], "badge": ""}, {"n": 11, "t": "新しい検査で、これまでの5本を洗い直しました", "min": 2.0, "b": [{"k": "say", "h": "v2.0 の検査を、検証の5本と旧キットのたくみ様に流しました。新しい基準なので、どの案件も ✕ が出ています", "opt": false}, {"k": "say", "h": "表の数字はページ×画面サイズの件数（同じ箇所が複数のサイズで数えられる）。最小13px・簡素なページの警告は全案件0件。追加したページ送りの確認は縦スワイプ型の4本とも合格", "opt": false}, {"k": "say", "h": "中身は3種類：①直すべきもの（アステップ様の4点、groxi様の地球の絵×本文、鈴興建設様の電話番号×人物の絵、FUKURU様のスタンプ×見出しなど）②わざと端から覗かせる写真の帯や絵（宣言して通す）③キーカラーの淡い文字（文字の色だけ濃くする。面の色はそのまま）", "opt": false}, {"k": "star", "h": "直すべきものは、順に直しています。<b>作業中の案件も、新しい検査に合格させてから出します</b>", "opt": false}, {"k": "say", "h": "検査の時間は公開1回あたり約340秒 → 約490秒（+4割強）。測るサイズと項目が増えたため", "opt": false}, {"k": "warn", "h": "件数の多さで初稿を否定しない。「ご評価はそのままに、弊社の基準を上げた」と言う。①は「直すべきもの」とはっきり言う", "opt": false}, {"k": "warn", "h": "まだのこと：Safari の実測（有効化待ち）／承認まで通した公開は、5本とも A が不合格のため実案件では未実施。聞かれたら正直に", "opt": false}], "badge": ""}, {"n": 12, "t": "他の制作者による再現性", "min": 1.5, "b": [{"k": "say", "h": "道具で担保：シートの書き出し・検査（v2.0 で重なり・コントラスト・はみ出しも）・公開。誰がやっても同じ", "opt": false}, {"k": "say", "h": "人の承認で担保：最終チェックの承認欄が空なら公開できない（10画面）", "opt": false}, {"k": "say", "h": "人の判断に頼る：参考サイトの分析と、初稿の発想・写真・動きの強弱。往復の多くはここ", "opt": false}, {"k": "say", "h": "混乱しうる点：作業ルール283行・5日で20版と多くて速い。macOS・Chrome が前提", "opt": false}, {"k": "star", "h": "5本とも弊社の同じ担当。<b>ほかの制作者・ほかのAIでの再現はまだ検証していません</b>（23〜24画面につなぐ）", "opt": false}], "badge": ""}, {"n": 13, "t": "良かった点", "min": 1.0, "b": [{"k": "say"   });
  var planStart = []; S.reduce(function (a, s, i) { planStart[i] = a; return a + s.min; }, 0);
  var total = S.reduce(function (a, s) { return a + s.min; }, 0);

  function show(i, send) {
    i = Math.max(0, Math.min(S.length - 1, i));
    cur = i;
    var s = S[i];
    $('hn').textContent = s.n; $('ht').textContent = s.t; $('hp').textContent = s.badge && s.badge !== String(s.n) ? '資料の番号 ' + s.badge : ''; $('hp').hidden = !$('hp').textContent; $('hm').textContent = '目安 ' + s.min + '分';
    $('pg').textContent = s.n + ' / ' + S.length;
    $('intro').innerHTML = i === 0 && D.intro.length ? '<div class="intro"><h2>前置き（冒頭で必ず言う）</h2><ul class="b">' + D.intro.map(li).join('') + '</ul></div>' : '';
    $('bul').innerHTML = s.b.map(li).join('');
    var nx = S[i + 1];
    if (nx) {
      var st = nx.b.filter(function (b) { return b.k === 'star'; })[0];
      $('next').innerHTML = '次へ → <b>' + nx.n + '　' + nx.t + '</b>' + (st ? '<br>' + st.h : '');
    } else $('next').innerHTML = 'ここで本編は終わり。質疑へ';
    toc.querySelectorAll('button').forEach(function (b, k) { b.classList.toggle('on', k === i); });
    toc.children[i].scrollIntoView({ block: 'nearest' });
    document.querySelector('.main').scrollTop = 0;
    if (send) tell({ type: 'go', i: i });
    pace();
  }

  // ---- キー操作（このウィンドウでも、提案資料のウィンドウでも送れる） ----
  document.addEventListener('keydown', function (e) {
    if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].indexOf(e.key) >= 0) { e.preventDefault(); show(cur + (e.shiftKey && e.key === ' ' ? -1 : 1), true); }
    else if (['ArrowUp', 'ArrowLeft', 'PageUp'].indexOf(e.key) >= 0) { e.preventDefault(); show(cur - 1, true); }
    else if (e.key === 'Home') { e.preventDefault(); show(0, true); }
    else if (e.key === 'End') { e.preventDefault(); show(S.length - 1, true); }
  });

  // ---- タイマー（予定との差を表示） ----
  var t0 = 0, acc = 0, run = false;
  function el() { return acc + (run ? Date.now() - t0 : 0); }
  function fmt(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + ('0' + s % 60).slice(-2); }
  function pace() {
    var plan = planStart[cur] * 60000, now = el(), d = now - plan, p = $('pace');
    p.textContent = '予定 ' + fmt(plan) + '／全体 ' + (Math.round(total * 10) / 10) + '分' + (now > 0 ? (d > 60000 ? '　' + fmt(d) + ' 押し' : d < -60000 ? '　' + fmt(-d) + ' 巻き' : '　予定どおり') : '');
    p.className = 'pace' + (now > 0 ? (d > 60000 ? ' late' : ' ok') : '');
  }
  setInterval(function () { $('clock').textContent = fmt(el()); pace(); }, 500);
  $('tgo').addEventListener('click', function () {
    if (run) { acc += Date.now() - t0; run = false; this.textContent = '再開'; }
    else { t0 = Date.now(); run = true; this.textContent = '一時停止'; }
  });
  $('treset').addEventListener('click', function () { acc = 0; t0 = Date.now(); if (!run) $('tgo').textContent = '開始'; $('clock').textContent = '0:00'; pace(); });

  // ---- 右の資料（タブ） ----
  var tabs = [
    ['想定問答', function () { return '<table>' + D.qa.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</table>'; }],
        ['30秒要約', function () { return '<ul class="b">' + D.summary.map(li).join('') + '</ul>'; }],
    ['前置き', function () { return '<ul class="b">' + D.intro.map(li).join('') + '</ul>'; }],
    ['使い方', function () { return '<div class="meta">' + D.meta.map(function (m) { return '<p>' + m + '</p>'; }).join('') + '</div><p class="keys">「検証レポートを開く」で別ウィンドウに資料が開きます。共有する画面へ移して全画面にしてください。どちらのウィンドウで矢印キーを押しても、もう片方が同じ画面に合わせて動きます。資料側で（？）を開くと、この画面の上部に表示されます。</p>'; }],
  ];
  var tb = $('tabs');
  tabs.forEach(function (t, k) {
    var b = document.createElement('button'); b.textContent = t[0];
    b.addEventListener('click', function () { tb.querySelectorAll('button').forEach(function (x, j) { x.classList.toggle('on', j === k); }); $('panel').innerHTML = t[1](); });
    tb.appendChild(b);
  });
  tb.firstChild.click();

  var h = location.hash.match(/^#p(\d+)$/);
  show(h ? parseInt(h[1], 10) - 1 : 0, false);
})();
</script>
</body>
</html>
